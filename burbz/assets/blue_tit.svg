<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#3498db" stop-opacity="0.3"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="-50" y2="100" stroke="#3498db" stroke-width="2"/>
    <line x1="200" y1="200" x2="450" y2="100" stroke="#3498db" stroke-width="2"/>
    <line x1="200" y1="200" x2="-50" y2="300" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="450" y2="300" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="100" y2="-50" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="300" y2="-50" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Blue Tit - acrobatic trickster pose -->
  <g transform="translate(200,200)">
    <!-- Body - round and small -->
    <ellipse cx="0" cy="5" rx="38" ry="42" fill="#a8c744" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Yellow chest -->
    <ellipse cx="0" cy="10" rx="28" ry="30" fill="#f1c40f"/>
    <!-- Head -->
    <circle cx="5" cy="-40" r="28" fill="#3498db" stroke="#1a1a2e" stroke-width="3"/>
    <!-- White face patch -->
    <circle cx="10" cy="-38" r="16" fill="white" opacity="0.9"/>
    <!-- Eye stripe -->
    <line x1="-5" y1="-40" x2="25" y2="-40" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Eye -->
    <circle cx="14" cy="-40" r="6" fill="white"/>
    <circle cx="15" cy="-40" r="3.5" fill="#1a1a2e"/>
    <circle cx="16" cy="-41" r="1.2" fill="white"/>
    <!-- Cheeky grin brow -->
    <line x1="6" y1="-49" x2="20" y2="-47" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blue cap -->
    <path d="M-15,-60 Q5,-80 25,-60" fill="#2980b9" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Beak - small -->
    <polygon points="26,-38 38,-36 26,-33" fill="#2c3e50" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings - one up in acrobatic pose -->
    <path d="M-35,0 L-80,-50 L-70,-20 L-45,10 Z" fill="#3498db" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-80,-50 L-100,-65 L-85,-35 Z" fill="#2980b9" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M35,5 L70,20 L65,35 L40,20 Z" fill="#3498db" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Tail -->
    <path d="M-10,42 L-15,75 L0,65 L15,75 L10,42 Z" fill="#3498db" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-10" y1="42" x2="-15" y2="70" stroke="#5D6D7E" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="42" x2="15" y2="70" stroke="#5D6D7E" stroke-width="3" stroke-linecap="round"/>
    <!-- Sparkle effects - trickster -->
    <g fill="#f1c40f" opacity="0.8">
      <polygon points="60,-55 63,-48 70,-48 64,-43 66,-36 60,-40 54,-36 56,-43 50,-48 57,-48" transform="scale(0.6)"/>
      <polygon points="-80,-20 -77,-13 -70,-13 -76,-8 -74,-1 -80,-5 -86,-1 -84,-8 -90,-13 -83,-13" transform="scale(0.5)"/>
    </g>
    <!-- Azure flash effect -->
    <circle cx="40" cy="-30" r="8" fill="none" stroke="#3498db" stroke-width="2" opacity="0.5"/>
    <circle cx="40" cy="-30" r="15" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3"/>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#3498db" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">BLUE TIT</text>
</svg>
