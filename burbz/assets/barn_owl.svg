<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%"><stop offset="0%" stop-color="#c49b63" stop-opacity="0.25"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <!-- Moon -->
  <circle cx="300" cy="80" r="35" fill="#f5f0e1" opacity="0.15"/>
  <g clip-path="url(#frame)" opacity="0.1">
    <line x1="200" y1="200" x2="0" y2="0" stroke="#f5f0e1" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="400" y2="0" stroke="#f5f0e1" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="0" y2="400" stroke="#c49b63" stroke-width="1"/>
    <line x1="200" y1="200" x2="400" y2="400" stroke="#c49b63" stroke-width="1"/>
  </g>
  <!-- Barn Owl - phantom mage -->
  <g transform="translate(200,200)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="58" fill="#c49b63" stroke="#1a1a2e" stroke-width="3"/>
    <!-- White front -->
    <ellipse cx="0" cy="5" rx="35" ry="45" fill="#f5f0e1"/>
    <!-- Speckle pattern -->
    <g fill="#c49b63" opacity="0.3">
      <circle cx="-10" cy="15" r="2"/><circle cx="8" cy="20" r="1.5"/>
      <circle cx="-5" cy="30" r="1.5"/><circle cx="12" cy="10" r="2"/>
      <circle cx="0" cy="35" r="1"/><circle cx="-15" cy="25" r="1.5"/>
    </g>
    <!-- Heart-shaped face disc -->
    <path d="M0,-80 Q-45,-55 -38,-25 Q-30,5 0,10 Q30,5 38,-25 Q45,-55 0,-80 Z" fill="#f5f0e1" stroke="#c49b63" stroke-width="2.5"/>
    <!-- Face disc border -->
    <path d="M0,-78 Q-42,-53 -36,-25 Q-28,3 0,8 Q28,3 36,-25 Q42,-53 0,-78 Z" fill="none" stroke="#c49b63" stroke-width="3"/>
    <!-- Eyes - large, dark, haunting -->
    <circle cx="-14" cy="-45" r="12" fill="#1a1a2e"/>
    <circle cx="-14" cy="-45" r="8" fill="#2c3e50"/>
    <circle cx="-12" cy="-46" r="3" fill="white" opacity="0.7"/>
    <circle cx="14" cy="-45" r="12" fill="#1a1a2e"/>
    <circle cx="14" cy="-45" r="8" fill="#2c3e50"/>
    <circle cx="16" cy="-46" r="3" fill="white" opacity="0.7"/>
    <!-- Beak -->
    <polygon points="0,-30 -5,-22 5,-22" fill="#c49b63" stroke="#1a1a2e" stroke-width="1"/>
    <!-- Wings - spread wide, ghostly -->
    <path d="M-44,-5 L-120,-30 L-115,0 L-110,30 L-50,20 Z" fill="#c49b63" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-120,-30 L-150,-35 L-130,5 Z" fill="#a67c4a" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M44,-5 L120,-30 L115,0 L110,30 L50,20 Z" fill="#c49b63" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M120,-30 L150,-35 L130,5 Z" fill="#a67c4a" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Tail -->
    <path d="M-12,55 L-15,80 L0,72 L15,80 L12,55 Z" fill="#a67c4a" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Talons -->
    <path d="M-15,52 L-18,78 L-25,85 M-18,78 L-12,88" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M15,52 L18,78 L25,85 M18,78 L12,88" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Ghostly aura -->
    <circle cx="0" cy="-20" r="75" fill="none" stroke="#f5f0e1" stroke-width="1" opacity="0.1"/>
    <circle cx="0" cy="-20" r="90" fill="none" stroke="#f5f0e1" stroke-width="0.5" opacity="0.08"/>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#c49b63" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">BARN OWL</text>
</svg>
