<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#ecf0f1" stop-opacity="0.15"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.1">
    <line x1="200" y1="200" x2="50" y2="50" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="200" y1="200" x2="350" y2="50" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="200" y1="200" x2="50" y2="350" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="350" y2="350" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Magpie - trickster -->
  <g transform="translate(195,185)">
    <!-- Long tail -->
    <path d="M-5,55 L-10,140 L0,132 L10,140 L5,55 Z" fill="#0d2137" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Iridescent tail sheen -->
    <path d="M-3,70 L-5,130 L0,125 L5,130 L3,70 Z" fill="#2980b9" opacity="0.25"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- White belly -->
    <ellipse cx="0" cy="15" rx="30" ry="30" fill="#ecf0f1"/>
    <!-- Head -->
    <circle cx="5" cy="-48" r="27" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Iridescent head sheen -->
    <circle cx="0" cy="-52" r="18" fill="#2c3e80" opacity="0.2"/>
    <!-- Eye - cunning -->
    <circle cx="16" cy="-50" r="7" fill="white"/>
    <circle cx="17" cy="-50" r="4" fill="#1a1a2e"/>
    <circle cx="18" cy="-51" r="1.5" fill="white"/>
    <!-- Sly brow -->
    <path d="M8,-60 Q16,-62 23,-57" stroke="#0d0d0d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Beak -->
    <polygon points="25,-48 42,-44 25,-40" fill="#2c3e50" stroke="#0d0d0d" stroke-width="1.5"/>
    <!-- Wings - white panels -->
    <path d="M-36,-5 L-85,-30 L-80,-5 L-42,12 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M-85,-30 L-110,-35 L-95,-10 Z" fill="#ecf0f1" stroke="#0d0d0d" stroke-width="2"/>
    <path d="M36,-5 L85,-30 L80,-5 L42,12 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M85,-30 L110,-35 L95,-10 Z" fill="#ecf0f1" stroke="#0d0d0d" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-10" y1="45" x2="-15" y2="72" stroke="#2c3e50" stroke-width="3"/>
    <line x1="10" y1="45" x2="15" y2="72" stroke="#2c3e50" stroke-width="3"/>
    <!-- Stolen shiny object -->
    <circle cx="45" cy="-15" r="6" fill="#f4d03f" stroke="#DAA520" stroke-width="1.5"/>
    <circle cx="43" cy="-17" r="2" fill="white" opacity="0.6"/>
    <!-- Mirror/trick sparkles -->
    <g fill="white" opacity="0.5">
      <polygon points="55,-30 57,-25 62,-25 58,-22 59,-17 55,-20 51,-17 52,-22 48,-25 53,-25" transform="scale(0.5) translate(60,-40)"/>
      <polygon points="-70,-50 -68,-45 -63,-45 -67,-42 -66,-37 -70,-40 -74,-37 -73,-42 -77,-45 -72,-45" transform="scale(0.4)"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#1a1a2e" stroke="#ecf0f1" stroke-width="1" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#ecf0f1" text-anchor="middle" letter-spacing="3">EURASIAN MAGPIE</text>
</svg>
