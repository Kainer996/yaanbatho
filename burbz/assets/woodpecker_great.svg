<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#c0392b" stop-opacity="0.25"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="50" y2="50" stroke="#c0392b" stroke-width="2"/>
    <line x1="200" y1="200" x2="350" y2="50" stroke="#c0392b" stroke-width="2"/>
    <line x1="200" y1="200" x2="50" y2="350" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="350" y2="350" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Great Spotted Woodpecker - bruiser -->
  <g transform="translate(200,195)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="38" ry="52" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- White shoulder patches -->
    <ellipse cx="-20" cy="-8" rx="15" ry="20" fill="#ecf0f1" opacity="0.8"/>
    <ellipse cx="20" cy="-8" rx="15" ry="20" fill="#ecf0f1" opacity="0.8"/>
    <!-- Red undertail -->
    <ellipse cx="0" cy="40" rx="20" ry="12" fill="#c0392b"/>
    <!-- Head -->
    <circle cx="3" cy="-50" r="26" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Red cap/nape -->
    <path d="M-10,-72 Q3,-80 16,-72 L12,-62 Q3,-68 -6,-62 Z" fill="#c0392b" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- White face stripe -->
    <path d="M-15,-55 L20,-50" stroke="#ecf0f1" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- Eye -->
    <circle cx="12" cy="-52" r="6" fill="white"/>
    <circle cx="13" cy="-52" r="3.5" fill="#1a1a2e"/>
    <circle cx="14" cy="-53" r="1.2" fill="white"/>
    <!-- Angry brow -->
    <line x1="5" y1="-61" x2="20" y2="-58" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
    <!-- Strong chisel beak -->
    <polygon points="22,-50 50,-44 48,-38 22,-42" fill="#5D6D7E" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Wings -->
    <path d="M-34,-5 L-80,-28 L-75,-5 L-40,12 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- White wing spots -->
    <circle cx="-60" cy="-15" r="5" fill="#ecf0f1" opacity="0.7"/>
    <circle cx="-50" cy="-8" r="4" fill="#ecf0f1" opacity="0.7"/>
    <path d="M34,-5 L80,-28 L75,-5 L40,12 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <circle cx="60" cy="-15" r="5" fill="#ecf0f1" opacity="0.7"/>
    <!-- Stiff tail (prop) -->
    <path d="M-10,48 L-12,85 L0,80 L12,85 L10,48 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2"/>
    <!-- Legs gripping -->
    <line x1="-10" y1="42" x2="-15" y2="65" stroke="#5D6D7E" stroke-width="3"/>
    <line x1="10" y1="42" x2="15" y2="65" stroke="#5D6D7E" stroke-width="3"/>
    <!-- Impact/drum effects -->
    <g opacity="0.5">
      <circle cx="55" cy="-42" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
      <circle cx="55" cy="-42" r="10" fill="none" stroke="#c0392b" stroke-width="1.5"/>
      <circle cx="55" cy="-42" r="16" fill="none" stroke="#c0392b" stroke-width="1"/>
      <!-- Impact stars -->
      <polygon points="60,-42 62,-38 66,-38 63,-35 64,-31 60,-33 56,-31 57,-35 54,-38 58,-38" fill="#f39c12" transform="scale(0.7) translate(25,-18)"/>
    </g>
    <!-- Wood chip debris -->
    <g fill="#8B5E3C" opacity="0.4">
      <rect x="58" y="-50" width="4" height="3" rx="1" transform="rotate(30,60,-48)"/>
      <rect x="52" y="-55" width="3" height="2" rx="1" transform="rotate(-20,53,-54)"/>
      <rect x="65" y="-35" width="3" height="3" rx="1" transform="rotate(45,66,-34)"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#c0392b" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">GREAT SPOTTED WOODPECKER</text>
</svg>
