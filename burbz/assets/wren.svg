<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#D4A574" stop-opacity="0.25"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="50" y2="80" stroke="#D4A574" stroke-width="2"/>
    <line x1="200" y1="200" x2="350" y2="80" stroke="#D4A574" stroke-width="2"/>
    <line x1="200" y1="200" x2="50" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="350" y2="320" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Wren - tiny speedster king -->
  <g transform="translate(200,210)">
    <!-- Body - tiny and round -->
    <ellipse cx="0" cy="0" rx="30" ry="32" fill="#8B5E3C" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Lighter belly -->
    <ellipse cx="0" cy="8" rx="22" ry="22" fill="#D4A574"/>
    <!-- Barring pattern -->
    <g stroke="#6d3a0a" stroke-width="1" opacity="0.4">
      <line x1="-20" y1="-5" x2="20" y2="-5"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="-20" y1="5" x2="20" y2="5"/>
      <line x1="-18" y1="10" x2="18" y2="10"/>
    </g>
    <!-- Head -->
    <circle cx="5" cy="-32" r="22" fill="#8B5E3C" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Eyebrow stripe -->
    <path d="M-8,-42 L25,-40" stroke="#D4A574" stroke-width="3" stroke-linecap="round"/>
    <!-- Eye - fierce for size -->
    <circle cx="14" cy="-34" r="5.5" fill="#1a1a2e"/>
    <circle cx="15" cy="-35" r="2" fill="white"/>
    <!-- Brow -->
    <line x1="8" y1="-42" x2="20" y2="-40" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Beak - thin needle -->
    <polygon points="22,-32 42,-28 22,-27" fill="#2c3e50" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings -->
    <path d="M-27,-2 L-58,-22 L-55,-5 L-32,8 Z" fill="#8B5E3C" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M27,0 L55,-15 L52,2 L32,10 Z" fill="#8B5E3C" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Signature cocked tail! -->
    <path d="M-8,28 L-15,10 L-22,-15 L-18,-20 L-10,5 L-5,28 Z" fill="#6d3a0a" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Tiny legs -->
    <line x1="-8" y1="28" x2="-12" y2="50" stroke="#D4A574" stroke-width="2.5"/>
    <line x1="8" y1="28" x2="12" y2="50" stroke="#D4A574" stroke-width="2.5"/>
    <!-- Sound waves - the king's song -->
    <g stroke="#D4A574" fill="none" stroke-width="1.5" opacity="0.4">
      <path d="M35,-25 Q42,-30 42,-22"/>
      <path d="M40,-28 Q50,-35 50,-18"/>
      <path d="M45,-31 Q58,-40 58,-15"/>
    </g>
    <!-- Crown hint -->
    <g fill="#f4d03f" opacity="0.6">
      <polygon points="0,-55 -5,-48 5,-48"/>
      <polygon points="-8,-52 -13,-45 -3,-45"/>
      <polygon points="8,-52 3,-45 13,-45"/>
    </g>
    <!-- Speed blur lines -->
    <g stroke="#D4A574" stroke-width="1" opacity="0.3">
      <line x1="-60" y1="10" x2="-80" y2="10"/>
      <line x1="-55" y1="15" x2="-75" y2="15"/>
      <line x1="-58" y1="20" x2="-70" y2="20"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#8B5E3C" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#D4A574" text-anchor="middle" letter-spacing="3">EURASIAN WREN</text>
</svg>
