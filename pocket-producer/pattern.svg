<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid">
  <defs>
    <pattern id="tile" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- halftone field -->
      <g fill="#cc0000" opacity="0.18">
        <circle cx="20"  cy="20"  r="2"/>
        <circle cx="60"  cy="20"  r="2"/>
        <circle cx="100" cy="20"  r="2"/>
        <circle cx="140" cy="20"  r="2"/>
        <circle cx="180" cy="20"  r="2"/>
        <circle cx="20"  cy="60"  r="2"/>
        <circle cx="60"  cy="60"  r="2"/>
        <circle cx="100" cy="60"  r="2"/>
        <circle cx="140" cy="60"  r="2"/>
        <circle cx="180" cy="60"  r="2"/>
        <circle cx="20"  cy="100" r="2"/>
        <circle cx="60"  cy="100" r="2"/>
        <circle cx="100" cy="100" r="2"/>
        <circle cx="140" cy="100" r="2"/>
        <circle cx="180" cy="100" r="2"/>
        <circle cx="20"  cy="140" r="2"/>
        <circle cx="60"  cy="140" r="2"/>
        <circle cx="100" cy="140" r="2"/>
        <circle cx="140" cy="140" r="2"/>
        <circle cx="180" cy="140" r="2"/>
        <circle cx="20"  cy="180" r="2"/>
        <circle cx="60"  cy="180" r="2"/>
        <circle cx="100" cy="180" r="2"/>
        <circle cx="140" cy="180" r="2"/>
        <circle cx="180" cy="180" r="2"/>
      </g>
      <!-- diagonal speed lines -->
      <g stroke="#fafafa" stroke-width="0.4" opacity="0.06">
        <line x1="-20" y1="0"   x2="220" y2="240"/>
        <line x1="-20" y1="40"  x2="220" y2="280"/>
        <line x1="-20" y1="80"  x2="220" y2="320"/>
        <line x1="-20" y1="120" x2="220" y2="360"/>
        <line x1="-20" y1="160" x2="220" y2="400"/>
        <line x1="-20" y1="-40" x2="220" y2="200"/>
        <line x1="-20" y1="-80" x2="220" y2="160"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#tile)"/>
</svg>
