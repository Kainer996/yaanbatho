<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Pocket Producer — manga-style hero</title>

  <defs>
    <pattern id="dotsCoarse" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#070707"/>
    </pattern>
    <pattern id="dotsFine" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#070707"/>
    </pattern>
    <pattern id="dotsRed" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#cc0000"/>
    </pattern>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="1"/>
      <stop offset="80%" stop-color="#fafafa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="600"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- BASE -->
    <rect width="1200" height="600" fill="#070707"/>

    <!-- RED DIAGONAL SLASH (top-right wedge) -->
    <polygon points="720,0 1200,0 1200,600 980,600" fill="#cc0000"/>
    <!-- thin red shard echoing the slash -->
    <polygon points="660,0 695,0 920,600 880,600" fill="#cc0000" opacity="0.55"/>

    <!-- HALFTONE EDGE PANELS -->
    <rect x="0" y="0" width="220" height="160" fill="#fafafa"/>
    <rect x="0" y="0" width="220" height="160" fill="url(#dotsFine)"/>
    <rect x="980" y="440" width="220" height="160" fill="#fafafa"/>
    <rect x="980" y="440" width="220" height="160" fill="url(#dotsCoarse)"/>

    <!-- SPEED LINES (radiate from a focal point off-canvas to the right) -->
    <g stroke="#fafafa" stroke-linecap="square" opacity="0.85">
      <line x1="1300" y1="300" x2="-100" y2="40"  stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="80"  stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="115" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="150" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="190" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="225" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="260" stroke-width="3"/>
      <line x1="1300" y1="300" x2="-100" y2="300" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="340" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="375" stroke-width="3"/>
      <line x1="1300" y1="300" x2="-100" y2="410" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="450" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="485" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="520" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="560" stroke-width="1"/>
      <line x1="1300" y1="300" x2="-100" y2="600" stroke-width="2"/>
      <line x1="1300" y1="300" x2="-100" y2="640" stroke-width="1"/>
    </g>

    <!-- BIG WHITE BURST CIRCLE -->
    <circle cx="380" cy="320" r="240" fill="url(#burst)"/>

    <!-- VINYL RECORD inside burst -->
    <g transform="translate(380 320)">
      <circle r="200" fill="#070707"/>
      <circle r="200" fill="none" stroke="#cc0000" stroke-width="3"/>
      <circle r="180" fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <circle r="160" fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <circle r="140" fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <circle r="120" fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <circle r="100" fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <circle r="80"  fill="none" stroke="#1c1c1c" stroke-width="0.6"/>
      <!-- centre label -->
      <circle r="62" fill="#cc0000"/>
      <circle r="62" fill="none" stroke="#070707" stroke-width="3"/>
      <circle r="6" fill="#070707"/>
      <!-- shine highlight -->
      <path d="M -180 -40 A 180 180 0 0 1 -40 -180" fill="none" stroke="#fafafa" stroke-width="2" opacity="0.3"/>
    </g>

    <!-- TONEARM stylised as bold ink strokes -->
    <g stroke="#070707" stroke-linecap="square" fill="none">
      <line x1="600" y1="120" x2="430" y2="270" stroke-width="6"/>
      <circle cx="600" cy="120" r="14" fill="#070707"/>
      <circle cx="600" cy="120" r="6"  fill="#fafafa"/>
      <rect x="420" y="260" width="28" height="14" fill="#070707"/>
    </g>

    <!-- INK SPLATTER ACCENTS (red) -->
    <g fill="#cc0000">
      <circle cx="180" cy="500" r="34"/>
      <circle cx="225" cy="540" r="14"/>
      <circle cx="155" cy="540" r="8"/>
      <circle cx="240" cy="510" r="6"/>
      <circle cx="115" cy="525" r="4"/>
    </g>

    <!-- KANJI-STYLE VERTICAL STRIPE on right -->
    <rect x="1110" y="20" width="60" height="420" fill="#070707" stroke="#fafafa" stroke-width="3"/>
    <g font-family="'Black Ops One', 'Impact', sans-serif" fill="#fafafa" text-anchor="middle">
      <text x="1140" y="80"  font-size="42">音</text>
      <text x="1140" y="140" font-size="42">楽</text>
      <text x="1140" y="200" font-size="42">製</text>
      <text x="1140" y="260" font-size="42">作</text>
      <text x="1140" y="320" font-size="42">者</text>
    </g>

    <!-- HALFTONE GRADIENT FADE under wordmark -->
    <rect x="640" y="380" width="380" height="40" fill="url(#dotsRed)" opacity="0.5"/>

    <!-- WORDMARK -->
    <g font-family="'Black Ops One', 'Impact', sans-serif">
      <text x="660" y="490" font-size="78" fill="#fafafa" letter-spacing="3">POCKET</text>
      <text x="660" y="558" font-size="58" fill="#070707" stroke="#fafafa" stroke-width="2" letter-spacing="2">PRODUCER</text>
    </g>

    <!-- SUBTITLE TICKER -->
    <g font-family="'VT323','Courier New',monospace" fill="#cc0000">
      <text x="660" y="448" font-size="22" letter-spacing="3">▸ MCP · SUNO · MIX · ARRANGE</text>
    </g>

    <!-- FRAME BORDER (manga panel) -->
    <rect x="3" y="3" width="1194" height="594" fill="none" stroke="#fafafa" stroke-width="6"/>
    <rect x="9" y="9" width="1182" height="582" fill="none" stroke="#fafafa" stroke-width="1"/>

  </g>
</svg>
