    <style>
        html, body { height: 100%; }
        body { overflow: hidden; background: #77bce9; }
        body::before, body::after { display: none; }
        header { background: linear-gradient(180deg, rgba(2,16,30,.58), rgba(2,16,30,.18)); border-bottom: 1px solid rgba(255,255,255,.18); position: fixed; width: 100%; }
        header::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent); }
        header .container { padding: 14px 20px; }
        nav { gap: 22px; flex-wrap: wrap; justify-content: flex-end; }
        nav a, .logo { text-shadow: 0 2px 14px rgba(0,25,50,.55); }
        nav a:hover, nav a.active { color: #fff4b8; }
        nav a.active::after { background: #fff4b8; box-shadow: 0 0 16px rgba(255,244,184,.85); bottom: -14px; }
        #ocean-stage { position: fixed; inset: 0; width: 100vw; height: 100vh; }
        .unknown-hud { position: fixed; left: clamp(18px, 4vw, 58px); bottom: clamp(18px, 5vh, 58px); z-index: 10; max-width: 510px; padding: 20px 22px; border: 1px solid rgba(255,255,255,.22); border-radius: 22px; background: linear-gradient(135deg, rgba(3,18,32,.38), rgba(4,57,88,.16)); backdrop-filter: blur(14px); box-shadow: 0 24px 80px rgba(0,24,50,.28); color: rgba(255,255,255,.92); }
        .unknown-hud .eyebrow { display: block; font-family: var(--font-heading); font-size: .74rem; letter-spacing: .28em; text-transform: uppercase; color: #fff4b8; margin-bottom: 8px; }
        .unknown-hud h1 { font-size: clamp(2rem, 5vw, 4.8rem); line-height: .9; margin: 0 0 10px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 5px 30px rgba(0,38,80,.42); }
        .unknown-hud p { margin: 0; font-size: clamp(.98rem, 1.5vw, 1.2rem); color: rgba(255,255,255,.78); }
        .quality-chip { position: fixed; right: clamp(14px, 3vw, 34px); bottom: clamp(14px, 3vw, 34px); z-index: 10; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 13px; background: rgba(0,20,38,.26); color: rgba(255,255,255,.74); font-size: .82rem; backdrop-filter: blur(10px); }
        .loader { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #bde8ff, #4186b7 58%, #113758); color: white; z-index: 30; font-family: var(--font-heading); letter-spacing: .16em; transition: opacity .7s ease; }
        .loader.hidden { opacity: 0; pointer-events: none; }
        @media (max-width: 760px) { body { overflow: hidden; } .logo { font-size: 15px; } nav { display: none; } .mobile-menu-btn { display: block; } .unknown-hud { left: 14px; right: 14px; bottom: 14px; } .quality-chip { display: none; } }

<body>

        <div class="container">
            <a href="/index.html" class="logo"><img src="/images/logo.png" alt="Yaan Batho" style="height:42px;width:42px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;">Yaan Batho</a>

    <div id="ocean-stage" aria-label="A realistic Three.js ocean surface under bright sunshine"></div>
    <div class="loader" id="loader">SUMMONING WATER</div>
    <section class="unknown-hud" aria-label="Project title">
        <span class="eyebrow">Three.js browser experiment</span>
        <h1>Unknown</h1>
        <p>Just water in the sunshine — a quiet middle-of-the-ocean study with procedural waves, glare, haze, and horizon light.</p>
    </section>
    <div class="quality-chip">drag to look · scroll to breathe</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const stage = document.getElementById('ocean-stage');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x8fcdf3, 0.022);

        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
        camera.position.set(0, 6.2, 19);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        stage.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 9;
        controls.maxDistance = 38;
        controls.minPolarAngle = Math.PI * 0.39;
        controls.maxPolarAngle = Math.PI * 0.535;
        controls.target.set(0, 1.4, -18);

        const sun = new THREE.Vector3(-0.34, 0.74, -0.58).normalize();
        const hemi = new THREE.HemisphereLight(0xdff6ff, 0x0b3151, 2.2);
        scene.add(hemi);
        const sunLight = new THREE.DirectionalLight(0xfff1bd, 4.4);
        sunLight.position.copy(sun).multiplyScalar(90);
        scene.add(sunLight);

        const skyGeo = new THREE.SphereGeometry(280, 48, 24);
        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            uniforms: { sunDir: { value: sun } },
            vertexShader: `varying vec3 vWorld; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vWorld=normalize(w.xyz); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `varying vec3 vWorld; uniform vec3 sunDir; void main(){ float h=clamp(vWorld.y*.5+.5,0.,1.); vec3 horizon=vec3(.78,.92,1.0); vec3 zenith=vec3(.18,.55,.86); vec3 sky=mix(horizon,zenith,smoothstep(.18,1.,h)); float s=pow(max(dot(normalize(vWorld),sunDir),0.), 780.); float halo=pow(max(dot(normalize(vWorld),sunDir),0.), 14.); sky += vec3(1.0,.78,.38)*halo*.42 + vec3(1.0,.95,.72)*s*3.6; gl_FragColor=vec4(sky,1.0); }`
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));

        const sunDisc = new THREE.Mesh(
            new THREE.CircleGeometry(5.5, 64),
            new THREE.MeshBasicMaterial({ color: 0xfff4b6, transparent: true, opacity: .92, depthWrite: false })
        );
        sunDisc.position.copy(sun).multiplyScalar(145);
        sunDisc.lookAt(camera.position);
        scene.add(sunDisc);

        const oceanGeo = new THREE.PlaneGeometry(520, 520, 360, 360);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMat = new THREE.ShaderMaterial({
            extensions: { derivatives: true },
            uniforms: {
                uTime: { value: 0 },
                uSun: { value: sun },
                uCam: { value: camera.position },
                uDeep: { value: new THREE.Color(0x04395f) },
                uShallow: { value: new THREE.Color(0x1597bb) },
                uFoam: { value: new THREE.Color(0xe9fbff) }
            },
            vertexShader: `
                uniform float uTime;
                varying vec3 vWorld;
                varying float vWave;
                float wave(vec2 p, vec2 d, float steep, float len, float speed){
                    float k=6.28318/len; float f=k*(dot(d,p)-speed*uTime);
                    return sin(f)*steep;
                }
                void main(){
                    vec3 pos=position;
                    float w=0.0;
                    w += wave(pos.xz, normalize(vec2( .86,.50)), .72, 16.0, 1.85);
                    w += wave(pos.xz, normalize(vec2(-.34,.94)), .42,  8.8, 1.15);
                    w += wave(pos.xz, normalize(vec2( .11,.99)), .20,  3.7, .82);
                    w += sin((pos.x*1.7+pos.z*.4)+uTime*2.5)*.035;
                    pos.y += w;
                    vWave = w;
                    vec4 world = modelMatrix * vec4(pos,1.0);
                    vWorld = world.xyz;
                    gl_Position = projectionMatrix * viewMatrix * world;
                }`,
            fragmentShader: `
                uniform float uTime; uniform vec3 uSun; uniform vec3 uCam; uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFoam;
                varying vec3 vWorld; varying float vWave;
                float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
                float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
                float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
                void main(){
                    vec3 dx=dFdx(vWorld), dy=dFdy(vWorld); vec3 n=normalize(cross(dx,dy)); if(n.y<0.0) n=-n;
                    float rip = fbm(vWorld.xz*1.15 + vec2(uTime*.08, -uTime*.12));
                    n = normalize(n + vec3((rip-.5)*.18, 0.0, (fbm(vWorld.zx*1.7-uTime*.06)-.5)*.18));
                    vec3 v=normalize(uCam-vWorld); vec3 l=normalize(uSun); vec3 h=normalize(v+l);
                    float fres=pow(1.0-max(dot(n,v),0.0), 4.3);
                    float spec=pow(max(dot(n,h),0.0), 680.0)*2.2 + pow(max(dot(n,h),0.0), 95.0)*.34;
                    float glitter = smoothstep(.78,1.0, noise(vWorld.xz*18.0 + uTime*.7)) * pow(max(dot(reflect(-l,n),v),0.0), 34.0);
                    float depthTint=smoothstep(-1.1,1.6,vWave);
                    vec3 water=mix(uDeep,uShallow,depthTint*.55 + fres*.42);
                    vec3 sky=vec3(.60,.86,1.0);
                    vec3 col=mix(water, sky, fres*.55);
                    col += vec3(1.0,.86,.45)*(spec + glitter*.28);
                    float foam=smoothstep(.58,1.05,vWave + (rip-.5)*.42) * .38;
                    col=mix(col,uFoam,foam);
                    float dist=length(vWorld.xz-uCam.xz);
                    col=mix(col, vec3(.78,.92,1.0), smoothstep(55.0,190.0,dist)*.62);
                    gl_FragColor=vec4(col,1.0);
                }`
        });
        scene.add(new THREE.Mesh(oceanGeo, oceanMat));

        const horizon = new THREE.Mesh(
            new THREE.PlaneGeometry(520, 80, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0xd9f2ff, transparent: true, opacity: .22, depthWrite: false })
        );
        horizon.position.set(0, 8, -175);
        scene.add(horizon);

        const clock = new THREE.Clock();
        function resize(){
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        }
        addEventListener('resize', resize);
        setTimeout(() => document.getElementById('loader').classList.add('hidden'), 450);
        function tick(){
            const t = clock.getElapsedTime();
            oceanMat.uniforms.uTime.value = t;
            oceanMat.uniforms.uCam.value.copy(camera.position);
            sunDisc.lookAt(camera.position);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
