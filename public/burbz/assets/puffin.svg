<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#e74c3c" stop-opacity="0.2"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.1">
    <line x1="200" y1="200" x2="50" y2="50" stroke="#e74c3c" stroke-width="2"/>
    <line x1="200" y1="200" x2="350" y2="50" stroke="#f39c12" stroke-width="2"/>
    <line x1="200" y1="200" x2="50" y2="350" stroke="#4cc9f0" stroke-width="1"/>
    <line x1="200" y1="200" x2="350" y2="350" stroke="#4cc9f0" stroke-width="1"/>
  </g>
  <!-- Puffin - ocean clown prince -->
  <g transform="translate(200,200)">
    <!-- Body - stout -->
    <ellipse cx="0" cy="5" rx="42" ry="50" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- White front -->
    <ellipse cx="0" cy="12" rx="32" ry="38" fill="#ecf0f1"/>
    <!-- Head -->
    <circle cx="3" cy="-45" r="30" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- White face -->
    <path d="M-5,-65 Q15,-70 25,-50 Q28,-35 10,-25 Q-10,-25 -20,-40 Q-22,-55 -5,-65 Z" fill="#ecf0f1"/>
    <!-- Sad/cute triangle eye patch -->
    <path d="M5,-60 L18,-45 L-5,-45 Z" fill="#5D6D7E" opacity="0.4"/>
    <!-- Eye - expressive -->
    <circle cx="10" cy="-50" r="7" fill="#2c3e50"/>
    <circle cx="10" cy="-50" r="5" fill="#1a1a2e"/>
    <circle cx="11" cy="-51" r="2.5" fill="white"/>
    <!-- The iconic beak! -->
    <path d="M22,-48 L28,-48 L50,-38 L48,-30 L28,-28 L22,-30 Z" fill="#e74c3c" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M28,-48 L28,-28" stroke="#f39c12" stroke-width="0" fill="none"/>
    <!-- Beak stripes -->
    <path d="M30,-47 L48,-38" stroke="#f39c12" stroke-width="4" opacity="0.7"/>
    <line x1="28" y1="-38" x2="48" y2="-34" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Beak tip -->
    <path d="M44,-40 L55,-35 L44,-30" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <!-- Wings - stubby -->
    <path d="M-38,0 L-65,-15 L-62,10 L-42,18 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M38,0 L65,-15 L62,10 L42,18 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Orange feet! -->
    <path d="M-15,50 L-20,70 L-35,75 M-20,70 L-20,78 M-20,70 L-10,76" stroke="#e67e22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M15,50 L20,70 L35,75 M20,70 L20,78 M20,70 L10,76" stroke="#e67e22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Fish in beak -->
    <path d="M50,-42 L68,-38 L50,-34 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="63" cy="-37" r="1.5" fill="#1a1a2e"/>
    <!-- Ocean spray -->
    <g fill="#4cc9f0" opacity="0.3">
      <circle cx="-55" cy="40" r="3"/>
      <circle cx="-48" cy="50" r="2"/>
      <circle cx="55" cy="45" r="2.5"/>
      <circle cx="48" cy="55" r="2"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#e74c3c" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">ATLANTIC PUFFIN</text>
</svg>
