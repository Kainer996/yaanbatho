<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Library">
<defs>
  <linearGradient id="lib-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06f42"/><stop offset="1" stop-color="#5a3f22"/></linearGradient>
  <linearGradient id="lib-wood-dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#755030"/><stop offset="1" stop-color="#3c2915"/></linearGradient>
  <linearGradient id="lib-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5478"/><stop offset="1" stop-color="#3d2f47"/></linearGradient>
  <linearGradient id="lib-bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a2c"/><stop offset="1" stop-color="#2b1c0e"/></linearGradient>
  <linearGradient id="lib-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a2"/><stop offset=".5" stop-color="#d6a84f"/><stop offset="1" stop-color="#8a6224"/></linearGradient>
  <radialGradient id="lib-glow"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f0c767" stop-opacity=".85"/><stop offset="1" stop-color="#f0c767" stop-opacity="0"/></radialGradient>
  <radialGradient id="lib-hearth"><stop offset="0" stop-color="#ffdf9e" stop-opacity=".9"/><stop offset="1" stop-color="#e2842f" stop-opacity="0"/></radialGradient>
</defs>
<g stroke="#140d06" stroke-linejoin="round" stroke-linecap="round">
  <!-- The bough that carries the house, gnarled and forked like the tree's own. -->
  <path d="M18 428C70 402 128 392 180 398 250 406 330 404 396 392 442 384 478 386 500 396L498 420C462 412 430 412 398 418 328 430 244 432 176 424 122 418 72 428 26 448Z" fill="url(#lib-bark)" stroke-width="7"/>
  <path d="M382 400C412 380 428 356 434 330" fill="none" stroke="url(#lib-bark)" stroke-width="14"/>
  <path d="M92 408C74 390 66 370 64 348" fill="none" stroke="url(#lib-bark)" stroke-width="12"/>
  <path d="M40 430q30-14 62-16M330 414q40-4 76-14" stroke="#8a6a3a" stroke-width="3" fill="none" opacity=".6"/>
  <!-- Gold leaves at the twig tips. -->
  <path d="M434 330q16-12 26-4-2 14-20 16-8-4-6-12z" fill="url(#lib-gold)" stroke-width="3"/>
  <path d="M64 348q-14-14-26-8 0 14 18 18 8-2 8-10z" fill="url(#lib-gold)" stroke-width="3"/>
  <path d="M452 348q14-10 24-4-2 12-18 14-8-2-6-10z" fill="url(#lib-gold)" stroke-width="3" opacity=".9"/>
  <!-- Deck the house stands on, with support struts into the bough. -->
  <path d="M118 372h276l-14 24H132Z" fill="url(#lib-wood-dk)" stroke-width="6"/>
  <path d="M150 396l-16 26M362 396l16 26M256 398v26" stroke="#3c2915" stroke-width="9"/>
  <!-- The house: a tall gabled reading room. -->
  <rect x="150" y="196" width="212" height="178" fill="url(#lib-wood)" stroke-width="7"/>
  <path d="M150 232h212M150 300h212" stroke="#5a3f22" stroke-width="3" opacity=".8"/>
  <path d="M156 202v166M356 202v166" stroke="#755030" stroke-width="3" opacity=".7"/>
  <!-- Gable roof in scholar's plum, gold-trimmed, with a quill finial. -->
  <path d="M132 204 256 92l124 112-16 12-108-98-108 98z" fill="url(#lib-roof)" stroke-width="7"/>
  <path d="M148 216 256 118l108 98" fill="none" stroke="#d6a84f" stroke-width="4" opacity=".85"/>
  <path d="M186 182h140M212 158h88" stroke="#2c2136" stroke-width="4" opacity=".8"/>
  <path d="M256 92c2-22 12-34 30-40-4 16-12 26-22 32l-4 10z" fill="url(#lib-gold)" stroke-width="4"/>
  <!-- Round attic window, candle-warm. -->
  <circle cx="256" cy="176" r="26" fill="#17100a" stroke-width="6"/>
  <circle cx="256" cy="176" r="18" fill="url(#lib-glow)" stroke="#d6a84f" stroke-width="3"/>
  <path d="M256 158v36M238 176h36" stroke="#140d06" stroke-width="4"/>
  <!-- Twin reading windows. -->
  <g>
    <circle cx="196" cy="252" r="25" fill="#17100a" stroke-width="6"/>
    <circle cx="196" cy="252" r="17" fill="url(#lib-glow)" stroke="#d6a84f" stroke-width="3"/>
    <circle cx="316" cy="252" r="25" fill="#17100a" stroke-width="6"/>
    <circle cx="316" cy="252" r="17" fill="url(#lib-glow)" stroke="#d6a84f" stroke-width="3"/>
  </g>
  <!-- The open-book emblem over the door, in worked gold like a shop sign. -->
  <path d="M234 224q22-10 44 0l-3 10q-19-8-38 0z" fill="url(#lib-gold)" stroke-width="3.4"/>
  <path d="M256 222v12" stroke-width="2.6"/>
  <!-- The arched doorway, shelves of books glowing inside. -->
  <path d="M224 374v-64q32-30 64 0v64z" fill="#1c1209" stroke-width="6"/>
  <ellipse cx="256" cy="336" rx="42" ry="34" fill="url(#lib-hearth)" stroke="none"/>
  <g stroke-width="2.4">
    <path d="M230 322h52M230 348h52" stroke="#58402c" stroke-width="4"/>
    <rect x="232" y="304" width="8" height="18" rx="2" fill="#8a2f2a"/><rect x="242" y="300" width="8" height="22" rx="2" fill="#2e7d86"/><rect x="252" y="303" width="8" height="19" rx="2" fill="#d6a84f"/><rect x="262" y="299" width="8" height="23" rx="2" fill="#4a5f8a"/><rect x="272" y="304" width="8" height="18" rx="2" fill="#6b8a4a"/>
    <rect x="234" y="330" width="8" height="18" rx="2" fill="#4a5f8a"/><rect x="244" y="327" width="8" height="21" rx="2" fill="#d6a84f"/><rect x="254" y="331" width="8" height="17" rx="2" fill="#8a2f2a"/><rect x="264" y="326" width="8" height="22" rx="2" fill="#2e7d86"/>
  </g>
  <path d="M224 310q32-30 64 0" fill="none" stroke="#d6a84f" stroke-width="4"/>
  <!-- Hanging lantern on the left eave. -->
  <path d="M150 236v18" stroke="#3d2c14" stroke-width="4"/>
  <circle cx="150" cy="272" r="26" fill="url(#lib-glow)" stroke="none" opacity=".7"/>
  <rect x="141" y="254" width="18" height="26" rx="6" fill="#1c1209" stroke="#6b4a26" stroke-width="4"/>
  <rect x="145" y="259" width="10" height="16" rx="3" fill="#ffdf9e" stroke="none"/>
  <!-- Rope ladder from the deck down over the bough. -->
  <path d="M322 396c6 30 2 58-12 84M354 392c8 32 4 62-8 90" fill="none" stroke="#8a6a3a" stroke-width="5"/>
  <path d="M324 416l26-3M328 440l26-4M330 462l25-5" stroke="#6b4a26" stroke-width="5"/>
  <circle cx="344" cy="488" r="6" fill="url(#lib-gold)" stroke-width="3"/>
</g>
</svg>
