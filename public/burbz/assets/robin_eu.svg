<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#c0392b" stop-opacity="0.3"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <!-- BG -->
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <!-- Speed lines -->
  <g clip-path="url(#frame)" opacity="0.15">
    <line x1="200" y1="200" x2="-50" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="450" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="-50" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="450" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="0" y2="-50" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="400" y2="-50" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="0" y2="450" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="400" y2="450" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="-50" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="450" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="200" y2="-50" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="200" y2="450" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Robin body - fighting stance -->
  <g transform="translate(200,210)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="#8B4513" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Red breast -->
    <ellipse cx="0" cy="-10" rx="35" ry="35" fill="#c0392b" stroke="#8B4513" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="30" fill="#8B4513" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Eye - fierce -->
    <ellipse cx="10" cy="-60" rx="8" ry="7" fill="white"/>
    <circle cx="12" cy="-60" r="4.5" fill="#1a1a2e"/>
    <circle cx="13" cy="-61" r="1.5" fill="white"/>
    <!-- Angry brow -->
    <line x1="3" y1="-70" x2="20" y2="-67" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
    <!-- Beak -->
    <polygon points="25,-55 40,-52 25,-48" fill="#f39c12" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings spread - fighting pose -->
    <path d="M-40,-10 L-90,-40 L-85,-15 L-60,5 Z" fill="#8B4513" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-85,-40 L-110,-55 L-100,-30 Z" fill="#6d3a0a" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M40,-10 L90,-30 L85,-5 L60,10 Z" fill="#8B4513" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Tail -->
    <path d="M-15,50 L-25,90 L0,75 L25,90 L15,50 Z" fill="#6d3a0a" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Legs - stance -->
    <line x1="-15" y1="50" x2="-25" y2="85" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="20" y2="85" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-35,85 L-25,85 L-15,85" stroke="#f39c12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M10,85 L20,85 L30,85" stroke="#f39c12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Action effect -->
    <path d="M50,-60 L65,-75 L55,-55 L70,-60 L55,-45" stroke="#c0392b" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <!-- Name banner -->
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#c0392b" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">EUROPEAN ROBIN</text>
</svg>
