<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%"><stop offset="0%" stop-color="#E74C3C" stop-opacity="0.2"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.15">
    <line x1="300" y1="0" x2="100" y2="400" stroke="#E74C3C" stroke-width="2"/>
    <line x1="100" y1="0" x2="300" y2="400" stroke="#5D6D7E" stroke-width="1.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Sparrowhawk - ambush assassin -->
  <g transform="translate(200,195)">
    <!-- Body - lean and lethal -->
    <ellipse cx="0" cy="0" rx="35" ry="55" fill="#5D6D7E" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Barred chest -->
    <g stroke="#E74C3C" stroke-width="1.5" opacity="0.5">
      <line x1="-22" y1="-10" x2="22" y2="-10"/>
      <line x1="-24" y1="-3" x2="24" y2="-3"/>
      <line x1="-22" y1="4" x2="22" y2="4"/>
      <line x1="-20" y1="11" x2="20" y2="11"/>
      <line x1="-18" y1="18" x2="18" y2="18"/>
      <line x1="-16" y1="25" x2="16" y2="25"/>
    </g>
    <!-- White underside -->
    <ellipse cx="0" cy="5" rx="25" ry="35" fill="#ecf0f1" opacity="0.3"/>
    <!-- Head -->
    <circle cx="3" cy="-53" r="26" fill="#5D6D7E" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Fierce yellow eye -->
    <circle cx="15" cy="-55" r="8" fill="#f39c12"/>
    <circle cx="16" cy="-55" r="4.5" fill="#1a1a2e"/>
    <circle cx="17" cy="-56" r="1.8" fill="#f39c12"/>
    <!-- Killer brow -->
    <line x1="5" y1="-65" x2="24" y2="-62" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
    <!-- Hooked beak -->
    <path d="M22,-52 L38,-47 L34,-40 L22,-45 Z" fill="#2c3e50" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings - attack spread -->
    <path d="M-32,-8 L-100,-40 L-95,-12 L-38,8 Z" fill="#5D6D7E" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-100,-40 L-125,-48 L-110,-20 Z" fill="#4a5b6e" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M32,-8 L95,-45 L90,-15 L38,8 Z" fill="#5D6D7E" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Long tail - rudder -->
    <path d="M-12,50 L-18,100 L0,90 L18,100 L12,50 Z" fill="#4a5b6e" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Barred tail -->
    <g stroke="#2c3e50" stroke-width="1.5" opacity="0.5">
      <line x1="-12" y1="65" x2="12" y2="65"/>
      <line x1="-14" y1="75" x2="14" y2="75"/>
      <line x1="-12" y1="85" x2="12" y2="85"/>
    </g>
    <!-- Talons - razor -->
    <path d="M-12,48 L-16,75 L-28,85 M-16,75 L-10,88 M-16,75 L-20,90" stroke="#f39c12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M12,48 L16,75 L28,85 M16,75 L10,88 M16,75 L20,90" stroke="#f39c12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Slash effects -->
    <g stroke="#E74C3C" stroke-width="2" opacity="0.5" fill="none">
      <path d="M40,-70 L55,-55 L45,-65"/>
      <path d="M-45,-65 L-60,-50 L-50,-60"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#5D6D7E" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="21" font-weight="bold" fill="#E74C3C" text-anchor="middle" letter-spacing="3">SPARROWHAWK</text>
</svg>
