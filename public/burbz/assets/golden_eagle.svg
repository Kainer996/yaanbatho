<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%"><stop offset="0%" stop-color="#8B6914" stop-opacity="0.35"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.15">
    <line x1="200" y1="200" x2="0" y2="0" stroke="#8B6914" stroke-width="3"/>
    <line x1="200" y1="200" x2="400" y2="0" stroke="#8B6914" stroke-width="3"/>
    <line x1="200" y1="200" x2="0" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="400" y2="400" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="200" x2="-50" y2="200" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="450" y2="200" stroke="#fff" stroke-width="1.5"/>
  </g>
  <!-- Golden Eagle - sovereign bruiser -->
  <g transform="translate(200,195)">
    <!-- Massive body -->
    <ellipse cx="0" cy="0" rx="55" ry="65" fill="#5C4033" stroke="#1a1a2e" stroke-width="3.5"/>
    <!-- Golden chest -->
    <ellipse cx="0" cy="-5" rx="40" ry="40" fill="#8B6914" opacity="0.7"/>
    <!-- Head - powerful -->
    <circle cx="0" cy="-65" r="32" fill="#8B6914" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Golden crown feathers -->
    <path d="M-20,-90 L-10,-100 L0,-88 L10,-100 L20,-90" fill="#DAA520" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Fierce eye -->
    <ellipse cx="14" cy="-67" rx="10" ry="8" fill="#f39c12"/>
    <circle cx="16" cy="-67" r="5" fill="#1a1a2e"/>
    <circle cx="17" cy="-68" r="2" fill="#f39c12"/>
    <!-- Heavy brow ridge -->
    <path d="M2,-78 L25,-73" stroke="#1a1a2e" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Massive hooked beak -->
    <path d="M25,-65 L50,-58 L42,-48 L28,-55 Z" fill="#2c3e50" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Huge wings spread -->
    <path d="M-50,-15 L-140,-55 L-130,-20 L-55,15 Z" fill="#5C4033" stroke="#1a1a2e" stroke-width="3"/>
    <path d="M-140,-55 L-175,-65 L-155,-35 Z" fill="#3E2723" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M50,-15 L140,-55 L130,-20 L55,15 Z" fill="#5C4033" stroke="#1a1a2e" stroke-width="3"/>
    <path d="M140,-55 L175,-65 L155,-35 Z" fill="#3E2723" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Talons - massive -->
    <path d="M-20,60 L-25,90 L-40,105 M-25,90 L-18,108 M-25,90 L-30,110" stroke="#2c3e50" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M20,60 L25,90 L40,105 M25,90 L18,108 M25,90 L30,110" stroke="#2c3e50" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M-15,60 L-25,100 L0,88 L25,100 L15,60 Z" fill="#3E2723" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Power aura -->
    <circle cx="0" cy="-10" r="80" fill="none" stroke="#DAA520" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="-10" r="95" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.1"/>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#8B6914" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">GOLDEN EAGLE</text>
</svg>
