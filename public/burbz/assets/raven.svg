<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#4a0080" stop-opacity="0.3"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="0" y2="0" stroke="#4a0080" stroke-width="3"/>
    <line x1="200" y1="200" x2="400" y2="0" stroke="#4a0080" stroke-width="3"/>
    <line x1="200" y1="200" x2="0" y2="400" stroke="#4a0080" stroke-width="2"/>
    <line x1="200" y1="200" x2="400" y2="400" stroke="#4a0080" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="0" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="400" y2="200" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Raven - ancient dark mage -->
  <g transform="translate(200,190)">
    <!-- Massive body -->
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="#0d0d0d" stroke="#000" stroke-width="3"/>
    <!-- Iridescent sheen -->
    <ellipse cx="-8" cy="-5" rx="35" ry="40" fill="#1a0033" opacity="0.3"/>
    <!-- Hackle feathers - throat -->
    <g fill="#0d0d0d" stroke="#1a1a2e" stroke-width="1">
      <path d="M-15,-30 L-12,-18 L-8,-30 Z"/>
      <path d="M-8,-30 L-5,-16 L-2,-30 Z"/>
      <path d="M-2,-30 L0,-15 L3,-30 Z"/>
      <path d="M3,-30 L6,-16 L9,-30 Z"/>
      <path d="M9,-30 L12,-18 L15,-30 Z"/>
    </g>
    <!-- Head - massive -->
    <circle cx="0" cy="-58" r="32" fill="#0d0d0d" stroke="#000" stroke-width="3"/>
    <!-- Glowing eye -->
    <circle cx="16" cy="-60" r="9" fill="#4a0080"/>
    <circle cx="16" cy="-60" r="6" fill="#7b2ff7"/>
    <circle cx="17" cy="-61" r="3" fill="white" opacity="0.7"/>
    <!-- Eye glow aura -->
    <circle cx="16" cy="-60" r="14" fill="none" stroke="#7b2ff7" stroke-width="2" opacity="0.3"/>
    <circle cx="16" cy="-60" r="20" fill="none" stroke="#4a0080" stroke-width="1" opacity="0.15"/>
    <!-- Heavy brow -->
    <path d="M3,-72 L28,-67" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    <!-- Massive beak -->
    <path d="M25,-58 L55,-48 L50,-38 L25,-45 Z" fill="#1a1a2e" stroke="#000" stroke-width="2"/>
    <!-- Beak ridge -->
    <line x1="25" y1="-55" x2="48" y2="-46" stroke="#2c2c2c" stroke-width="2"/>
    <!-- Wings - dark cloak -->
    <path d="M-46,-10 L-130,-45 L-125,-15 L-120,20 L-50,15 Z" fill="#0d0d0d" stroke="#000" stroke-width="2.5"/>
    <path d="M-130,-45 L-160,-52 L-140,-20 Z" fill="#050505" stroke="#000" stroke-width="2"/>
    <path d="M46,-10 L130,-45 L125,-15 L120,20 L50,15 Z" fill="#0d0d0d" stroke="#000" stroke-width="2.5"/>
    <path d="M130,-45 L160,-52 L140,-20 Z" fill="#050505" stroke="#000" stroke-width="2"/>
    <!-- Wedge tail -->
    <path d="M-15,55 L-22,100 L0,85 L22,100 L15,55 Z" fill="#050505" stroke="#000" stroke-width="2"/>
    <!-- Feet -->
    <path d="M-15,55 L-20,82 L-30,92 M-20,82 L-14,95 M-20,82 L-25,98" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M15,55 L20,82 L30,92 M20,82 L14,95 M20,82 L25,98" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Mystical runes -->
    <g stroke="#7b2ff7" fill="none" stroke-width="1.2" opacity="0.35">
      <circle cx="-65" cy="-55" r="12"/>
      <line x1="-65" y1="-67" x2="-65" y2="-43"/>
      <line x1="-77" y1="-55" x2="-53" y2="-55"/>
      <circle cx="70" cy="0" r="10"/>
      <line x1="70" y1="-10" x2="70" y2="10"/>
      <line x1="60" y1="0" x2="80" y2="0"/>
    </g>
    <!-- Dark energy particles -->
    <g fill="#7b2ff7" opacity="0.5">
      <circle cx="-50" cy="-70" r="3"/>
      <circle cx="55" cy="-50" r="2.5"/>
      <circle cx="-70" cy="10" r="2"/>
      <circle cx="65" cy="-25" r="2.5"/>
      <circle cx="-45" cy="30" r="2"/>
      <circle cx="50" cy="25" r="3"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#0d0d0d" stroke="#7b2ff7" stroke-width="1.5" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#7b2ff7" text-anchor="middle" letter-spacing="3">COMMON RAVEN</text>
</svg>
