<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#4169E1" stop-opacity="0.2"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="50" y2="80" stroke="#E8A87C" stroke-width="2"/>
    <line x1="200" y1="200" x2="350" y2="80" stroke="#4169E1" stroke-width="2"/>
    <line x1="200" y1="200" x2="50" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="200" x2="350" y2="320" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Eurasian Jay - colourful trickster -->
  <g transform="translate(200,200)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#E8A87C" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Pinkish-brown tones -->
    <ellipse cx="0" cy="5" rx="30" ry="35" fill="#D4956B" opacity="0.5"/>
    <!-- Head -->
    <circle cx="5" cy="-48" r="27" fill="#E8A87C" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Streaked crown -->
    <g stroke="#1a1a2e" stroke-width="2" opacity="0.5">
      <line x1="-10" y1="-70" x2="-8" y2="-55"/>
      <line x1="-5" y1="-72" x2="-3" y2="-55"/>
      <line x1="0" y1="-73" x2="2" y2="-55"/>
      <line x1="5" y1="-72" x2="7" y2="-55"/>
      <line x1="10" y1="-70" x2="12" y2="-55"/>
    </g>
    <!-- Black moustache stripe -->
    <path d="M18,-45 L25,-38 L18,-32" fill="#1a1a2e"/>
    <!-- Eye -->
    <circle cx="12" cy="-50" r="6.5" fill="#87CEEB"/>
    <circle cx="13" cy="-50" r="3.5" fill="#1a1a2e"/>
    <circle cx="14" cy="-51" r="1.5" fill="white"/>
    <!-- Playful brow -->
    <path d="M5,-59 Q12,-62 19,-57" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Beak -->
    <polygon points="22,-46 38,-42 22,-38" fill="#2c3e50" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings - showing blue panel! -->
    <path d="M-36,-5 L-78,-28 L-75,-5 L-40,12 Z" fill="#E8A87C" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Blue wing panel (the jay's signature) -->
    <rect x="-82" y="-25" width="22" height="15" rx="2" fill="#4169E1" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Blue barring -->
    <line x1="-80" y1="-20" x2="-62" y2="-20" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="-80" y1="-15" x2="-62" y2="-15" stroke="white" stroke-width="1"/>
    <path d="M36,-5 L78,-28 L75,-5 L40,12 Z" fill="#E8A87C" stroke="#1a1a2e" stroke-width="2.5"/>
    <rect x="60" y="-25" width="22" height="15" rx="2" fill="#4169E1" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="62" y1="-20" x2="80" y2="-20" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="62" y1="-15" x2="80" y2="-15" stroke="white" stroke-width="1"/>
    <!-- White rump -->
    <ellipse cx="0" cy="35" rx="18" ry="10" fill="#ecf0f1" opacity="0.6"/>
    <!-- Black tail -->
    <path d="M-10,48 L-15,82 L0,75 L15,82 L10,48 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-10" y1="42" x2="-14" y2="65" stroke="#D4956B" stroke-width="3"/>
    <line x1="10" y1="42" x2="14" y2="65" stroke="#D4956B" stroke-width="3"/>
    <!-- Acorn -->
    <circle cx="42" cy="-10" r="7" fill="#8B5E3C" stroke="#6d3a0a" stroke-width="1.5"/>
    <path d="M36,-16 Q42,-22 48,-16" fill="#6d3a0a" stroke="#5C4033" stroke-width="1"/>
    <line x1="42" y1="-22" x2="42" y2="-18" stroke="#6d3a0a" stroke-width="1.5"/>
    <!-- Wing dazzle sparkles -->
    <g opacity="0.5">
      <polygon points="-70,-35 -68,-30 -63,-30 -67,-27 -66,-22 -70,-25 -74,-22 -73,-27 -77,-30 -72,-30" fill="#4169E1" transform="scale(0.6) translate(-15,-20)"/>
      <polygon points="85,-35 87,-30 92,-30 88,-27 89,-22 85,-25 81,-22 82,-27 78,-30 83,-30" fill="#4169E1" transform="scale(0.5) translate(60,-25)"/>
    </g>
    <!-- Sound waves (alarm call) -->
    <g stroke="#E8A87C" fill="none" stroke-width="1.5" opacity="0.35">
      <path d="M32,-40 Q38,-45 38,-35"/>
      <path d="M36,-43 Q45,-50 45,-32"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#E8A87C" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#4169E1" text-anchor="middle" letter-spacing="3">EURASIAN JAY</text>
</svg>
