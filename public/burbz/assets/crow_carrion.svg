<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#6c3483" stop-opacity="0.3"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.12">
    <line x1="200" y1="200" x2="0" y2="50" stroke="#6c3483" stroke-width="2"/>
    <line x1="200" y1="200" x2="400" y2="50" stroke="#6c3483" stroke-width="2"/>
    <line x1="200" y1="200" x2="0" y2="350" stroke="#6c3483" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="400" y2="350" stroke="#6c3483" stroke-width="1.5"/>
  </g>
  <!-- Carrion Crow - dark mage -->
  <g transform="translate(200,195)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="42" ry="55" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Iridescent sheen -->
    <ellipse cx="-5" cy="-5" rx="30" ry="35" fill="#2c2c54" opacity="0.4"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="28" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Glowing eye -->
    <circle cx="12" cy="-57" r="8" fill="#6c3483"/>
    <circle cx="12" cy="-57" r="5" fill="#9b59b6"/>
    <circle cx="13" cy="-58" r="2.5" fill="white"/>
    <!-- Eye glow -->
    <circle cx="12" cy="-57" r="12" fill="none" stroke="#6c3483" stroke-width="1.5" opacity="0.4"/>
    <!-- Sinister brow -->
    <line x1="2" y1="-68" x2="22" y2="-64" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Stout beak -->
    <path d="M22,-55 L42,-50 L38,-42 L22,-47 Z" fill="#2c3e50" stroke="#0d0d0d" stroke-width="2"/>
    <!-- Wings - cloak-like -->
    <path d="M-38,-5 L-95,-30 L-90,-5 L-85,25 L-45,15 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M38,-5 L95,-30 L90,-5 L85,25 L45,15 Z" fill="#1a1a2e" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Tail -->
    <path d="M-12,50 L-20,85 L0,75 L20,85 L12,50 Z" fill="#0d0d0d" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-12" y1="48" x2="-18" y2="78" stroke="#2c3e50" stroke-width="3.5"/>
    <line x1="12" y1="48" x2="18" y2="78" stroke="#2c3e50" stroke-width="3.5"/>
    <!-- Mystical hex effects -->
    <g stroke="#6c3483" fill="none" opacity="0.5" stroke-width="1.5">
      <circle cx="-55" cy="-50" r="10"/>
      <circle cx="-55" cy="-50" r="5"/>
      <circle cx="60" cy="10" r="8"/>
      <circle cx="60" cy="10" r="4"/>
    </g>
    <!-- Dark energy particles -->
    <circle cx="-40" cy="-65" r="3" fill="#9b59b6" opacity="0.6"/>
    <circle cx="50" cy="-40" r="2.5" fill="#6c3483" opacity="0.7"/>
    <circle cx="-60" cy="0" r="2" fill="#9b59b6" opacity="0.5"/>
    <circle cx="45" cy="-70" r="2" fill="#6c3483" opacity="0.4"/>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#1a1a2e" stroke="#6c3483" stroke-width="1" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#9b59b6" text-anchor="middle" letter-spacing="3">CARRION CROW</text>
</svg>
