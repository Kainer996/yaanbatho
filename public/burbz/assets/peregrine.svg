<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%"><stop offset="0%" stop-color="#f39c12" stop-opacity="0.25"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <!-- Speed lines - diving feel -->
  <g clip-path="url(#frame)" opacity="0.2">
    <line x1="200" y1="0" x2="100" y2="400" stroke="#f39c12" stroke-width="2"/>
    <line x1="200" y1="0" x2="300" y2="400" stroke="#f39c12" stroke-width="2"/>
    <line x1="200" y1="0" x2="50" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="350" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="150" y2="400" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="250" y2="400" stroke="#fff" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="0" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="400" y2="300" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Falcon - diving attack pose -->
  <g transform="translate(200,190) rotate(-15)">
    <!-- Body - sleek -->
    <ellipse cx="0" cy="0" rx="35" ry="65" fill="#2c3e50" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Chest markings -->
    <ellipse cx="0" cy="10" rx="22" ry="30" fill="#34495e" opacity="0.6"/>
    <line x1="-8" y1="0" x2="-8" y2="30" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-5" x2="0" y2="35" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
    <line x1="8" y1="0" x2="8" y2="30" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="28" fill="#2c3e50" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Helmet/mask markings -->
    <path d="M-15,-80 L0,-55 L15,-80" fill="#1a1a2e" opacity="0.5"/>
    <!-- Fierce eye -->
    <ellipse cx="12" cy="-62" rx="9" ry="7" fill="#f39c12"/>
    <circle cx="13" cy="-62" r="4" fill="#1a1a2e"/>
    <circle cx="14" cy="-63" r="1.5" fill="#f39c12"/>
    <!-- Angry brow -->
    <line x1="5" y1="-72" x2="22" y2="-68" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Hooked beak -->
    <path d="M22,-60 L40,-55 L35,-48 L25,-52 Z" fill="#f39c12" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Wings - swept back, diving -->
    <path d="M-30,-20 L-120,-50 L-110,-25 L-40,5 Z" fill="#2c3e50" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-120,-50 L-150,-60 L-130,-35 Z" fill="#1c2833" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M30,-20 L110,-55 L105,-30 L35,5 Z" fill="#2c3e50" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M110,-55 L140,-65 L125,-40 Z" fill="#1c2833" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Talons extended -->
    <path d="M-15,60 L-20,85 L-30,95 M-20,85 L-15,98 M-20,85 L-25,100" stroke="#f39c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M15,60 L20,85 L30,95 M20,85 L15,98 M20,85 L25,100" stroke="#f39c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M-12,60 L-18,95 L0,85 L18,95 L12,60 Z" fill="#1c2833" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Impact lines -->
    <g opacity="0.6" stroke="#f39c12" stroke-width="2" fill="none">
      <path d="M55,-80 L70,-95 L60,-75"/>
      <path d="M-60,-75 L-75,-90 L-65,-70"/>
      <line x1="45" y1="-90" x2="55" y2="-105"/>
    </g>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#2c3e50" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="20" font-weight="bold" fill="#f39c12" text-anchor="middle" letter-spacing="3">PEREGRINE FALCON</text>
</svg>
