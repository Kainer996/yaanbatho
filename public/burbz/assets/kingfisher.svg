<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#0097e6" stop-opacity="0.3"/><stop offset="100%" stop-color="#0a0a12"/></radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g clip-path="url(#frame)" opacity="0.15">
    <line x1="200" y1="0" x2="100" y2="400" stroke="#0097e6" stroke-width="2"/>
    <line x1="200" y1="0" x2="300" y2="400" stroke="#0097e6" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#e67e22" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="50" y2="350" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="350" y2="350" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Kingfisher - assassin diving -->
  <g transform="translate(195,195) rotate(-10)">
    <!-- Body - compact and streamlined -->
    <ellipse cx="0" cy="0" rx="32" ry="48" fill="#0097e6" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Orange chest -->
    <ellipse cx="0" cy="8" rx="22" ry="30" fill="#e67e22"/>
    <!-- Head - large relative to body -->
    <circle cx="5" cy="-48" r="28" fill="#0097e6" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Head crest detail -->
    <path d="M-15,-70 Q5,-82 20,-68" fill="#005f99" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- White cheek patch -->
    <ellipse cx="15" cy="-45" rx="10" ry="8" fill="white" opacity="0.9"/>
    <!-- Eye -->
    <circle cx="16" cy="-50" r="6" fill="#1a1a2e"/>
    <circle cx="17" cy="-51" r="2" fill="white"/>
    <!-- Brow -->
    <line x1="8" y1="-58" x2="22" y2="-56" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Massive dagger beak -->
    <polygon points="28,-48 80,-42 28,-36" fill="#2c3e50" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="28" y1="-42" x2="75" y2="-42" stroke="#1a1a2e" stroke-width="1" opacity="0.5"/>
    <!-- Wings -->
    <path d="M-28,-5 L-75,-35 L-68,-10 L-35,10 Z" fill="#0097e6" stroke="#1a1a2e" stroke-width="2.5"/>
    <path d="M-75,-35 L-95,-42 L-80,-20 Z" fill="#005f99" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M28,0 L65,-20 L60,5 L35,15 Z" fill="#0097e6" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Short tail -->
    <path d="M-8,45 L-10,65 L0,58 L10,65 L8,45 Z" fill="#005f99" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Tiny legs -->
    <line x1="-8" y1="42" x2="-10" y2="60" stroke="#e67e22" stroke-width="2.5"/>
    <line x1="8" y1="42" x2="10" y2="60" stroke="#e67e22" stroke-width="2.5"/>
    <!-- Water splash effect -->
    <g opacity="0.4">
      <circle cx="65" cy="30" r="4" fill="#0097e6"/>
      <circle cx="75" cy="15" r="3" fill="#0097e6"/>
      <circle cx="55" cy="40" r="2.5" fill="#4cc9f0"/>
      <circle cx="80" cy="25" r="2" fill="#4cc9f0"/>
      <path d="M50,50 Q60,35 70,50 Q80,35 90,50" fill="none" stroke="#4cc9f0" stroke-width="1.5"/>
    </g>
    <!-- Jewel gleam -->
    <circle cx="-15" cy="-10" r="3" fill="white" opacity="0.4"/>
    <circle cx="10" cy="-65" r="2" fill="white" opacity="0.5"/>
  </g>
  <rect x="40" y="340" width="320" height="44" rx="4" fill="#e67e22" opacity="0.9"/>
  <text x="200" y="370" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">KINGFISHER</text>
</svg>
