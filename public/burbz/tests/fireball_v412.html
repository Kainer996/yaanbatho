<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/burbz/"><title>Fireball isolated browser proof</title><link rel="stylesheet" href="first_person_cast_controls.css"><link rel="stylesheet" href="wilderness_combat.css"><style>
body{margin:0;background:#1a2821;color:#fbe4b8;font:12px system-ui}#villageWalk{position:fixed;inset:0}#villageWalk>canvas{width:100%;height:100%}.vw-look{position:absolute;inset:0;touch-action:none}.vw-stick{position:absolute;left:18px;bottom:32px;width:94px;height:94px;border-radius:50%;background:#273f32c9;border:1px solid #caba89;color:#fbe4b8;touch-action:none}#toolbar{position:absolute;z-index:10;top:5px;left:5px;right:5px;background:#172922e8;padding:6px;border-radius:6px}#toolbar button,#toolbar select{min-height:32px;background:#314438;color:#fbe4b8;border:1px solid #bbaa77;border-radius:4px;margin:2px}summary{cursor:pointer}#metrics{max-height:110px;overflow:auto;font:10px monospace;white-space:pre-wrap}#capture{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#16251e;z-index:8}#capture[hidden]{display:none}
</style></head><body><section id="villageWalk"><div class="vw-look"></div><button class="vw-stick">MOVE</button></section><img id="capture" hidden><section id="toolbar"><strong>Isolated Fireball proof · actual combat modules · fixture terrain</strong><div><button id="reset">Reset foes</button><button id="aim">Face enemies</button><button id="safe">Safe settlement</button><button id="fly">Flight</button><button id="mute">Mute audio</button><select id="phase" aria-label="Captured phase"><option>charge</option><option>trail</option><option>impact</option><option>burn</option></select><button id="show">Show capture</button></div><details><summary>Proof metrics</summary><pre id="metrics"></pre></details></section>
<script src="lib/three.min.js"></script><script src="battle_core.js"></script><script src="loot_crafting_core.js"></script><script src="first_person_spell_core.js"></script><script src="first_person_cast_controls.js"></script><script src="audio_core.js"></script><script src="wilderness_combat_core.js"></script><script src="wilderness_birds.js"></script><script src="wilderness_combat.js"></script><script>
'use strict';
const host=document.getElementById('villageWalk'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,100),renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);host.prepend(renderer.domElement);scene.background=new THREE.Color(0x41504d);scene.fog=new THREE.Fog(0x41504d,38,85);scene.add(new THREE.HemisphereLight(0xffefce,0x172419,1.5));const sun=new THREE.DirectionalLight(0xffe1aa,.9);sun.position.set(5,15,7);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x314334}));ground.rotation.x=-Math.PI/2;ground.position.set(200,0,200);scene.add(ground);const grid=new THREE.GridHelper(240,40,0x81956a,0x405440);grid.position.set(200,.002,200);scene.add(grid);
const trees=new THREE.Group();scene.add(trees);const trunkGeo=new THREE.CylinderGeometry(.2,.35,5,6),crownGeo=new THREE.ConeGeometry(3,9,7),trunkMat=new THREE.MeshLambertMaterial({color:0x504638}),crownMat=new THREE.MeshLambertMaterial({color:0x243e31});for(let i=0;i<32;i++){const x=160+(i%8)*12,z=150+Math.floor(i/8)*35;if(Math.abs(x-200)<8)continue;const trunk=new THREE.Mesh(trunkGeo,trunkMat);trunk.position.set(x,2.5,z);const crown=new THREE.Mesh(crownGeo,crownMat);crown.position.set(x,8,z);trees.add(trunk,crown);}
let muted=false,plays=0;const clips=[];function ProbeAudio(src){const a=new Audio(src);clips.push(a);a.addEventListener('playing',()=>plays++);return a;}const sound=BurbzAudioCore.createAudioManager({Audio:ProbeAudio,getEnabled:()=>!muted});window.BurbzCombatAudio={play:(n,o)=>sound.play(n,o),stop:n=>sound.stop(n)};
let saved=JSON.parse(localStorage.getItem('burbz-fireball-test-save')||'null'),runtime,s,walk=0,captureMode=false,freezeFoes=false;const captures={},observed={errors:[],maxParticles:0,chargingFrames:0,releases:[],maxShots:0,frames:0};window.addEventListener('error',e=>observed.errors.push(e.message));
function start(){runtime?.dispose();freezeFoes=false;s={root:host,source:{scene,camera,renderer},player:{x:200,y:0,z:200,yaw:0,pitch:0,mode:'walk'},look:host.querySelector('.vw-look'),abort:new AbortController(),options:{character:()=>({combat:{B:BurbzBattleCore,L:BurbzLootCore,C:BurbzFirstPersonSpellCore,profile:{name:'Keeper'},kit:()=>({loadout:{spell:'ember_wisp',weapon:'willow_wand'}}),stored:saved,save:state=>{saved=state;localStorage.setItem('burbz-fireball-test-save',JSON.stringify(state));return true;}}})},world:{height:()=>0,safeAt:x=>x<100,refugeAt:x=>x<100,allowed:()=>!freezeFoes,combatAllowed3:()=>true,clear:()=>true,combatKey:(x,z)=>x+':'+z}};runtime=BurbzWildernessCombat.attach(s);}
start();
const move=host.querySelector('.vw-stick');move.addEventListener('pointerdown',e=>{move.setPointerCapture(e.pointerId);walk=1;});for(const ev of ['pointerup','pointercancel','lostpointercapture'])move.addEventListener(ev,()=>walk=0);
function face(){const a=runtime.diagnostics().actors.find(a=>a.fighter.hp>0);if(!a)return;s.player.x=a.position.x;s.player.z=a.position.z+24;s.player.yaw=0;s.player.pitch=Math.atan2(a.position.y-1.55,24);}
document.getElementById('reset').onclick=()=>{runtime?.dispose();runtime=null;saved=null;localStorage.removeItem('burbz-fireball-test-save');start();captureMode=false;document.getElementById('capture').hidden=true;};document.getElementById('aim').onclick=face;document.getElementById('safe').onclick=()=>{s.player.x=0;};document.getElementById('fly').onclick=()=>{s.player.mode=s.player.mode==='fly'?'walk':'fly';};document.getElementById('mute').onclick=e=>{muted=!muted;sound.setEnabled(!muted);e.target.textContent=muted?'Unmute audio':'Mute audio';};document.getElementById('show').onclick=()=>{const phase=document.getElementById('phase').value,img=document.getElementById('capture');captureMode=!captureMode;if(captureMode&&captures[phase])img.src=captures[phase];img.hidden=!captureMode;};
let prev=0,lastPaint=0;function frame(t){requestAnimationFrame(frame);const dt=prev?Math.min(.05,(t-prev)/1000):0;prev=t;if(walk){s.player.x-=Math.sin(s.player.yaw)*dt*3;s.player.z-=Math.cos(s.player.yaw)*dt*3;}runtime.update(dt);camera.position.set(s.player.x,s.player.y+1.55,s.player.z);camera.rotation.set(s.player.pitch,s.player.yaw,0,'YXZ');renderer.render(scene,camera);observed.frames++;const d=runtime.diagnostics();if(d.actors.length>=2)freezeFoes=true;observed.maxParticles=Math.max(observed.maxParticles,d.fire.particles);observed.maxShots=Math.max(observed.maxShots,d.projectiles.length);if(d.input.casting){observed.chargingFrames++;captures.charge=renderer.domElement.toDataURL('image/png');}if(d.projectiles.some(p=>p.age>.25&&p.age<.6)){captures.trail=renderer.domElement.toDataURL('image/png');observed.lastDirection=d.projectiles[0].direction;}if(d.impacts.some(p=>p.age>.04&&p.age<.2))captures.impact=renderer.domElement.toDataURL('image/png');if(d.actors.some(a=>a.burn&&a.burn.age>.2))captures.burn=renderer.domElement.toDataURL('image/png');if(t-lastPaint>200){lastPaint=t;document.getElementById('metrics').textContent=JSON.stringify({fixture:true,mode:s.player.mode,pose:s.player,fire:d.fire,input:d.input,hp:d.hero.hp,cr:d.state.cr,cooldowns:d.state.cooldowns,actors:d.actors.map(a=>({id:a.id,hp:a.fighter.hp,burn:a.burn})),records:d.state.records,projectiles:d.projectiles.map(p=>({age:p.age,position:p.position,direction:p.direction})),captures:Object.keys(captures),observed,audio:{muted,plays,clips:clips.slice(-6).map(a=>({src:a.src.split('/').pop(),paused:a.paused,time:a.currentTime,ready:a.readyState,loop:a.loop,error:a.error?.message}))},renderer:{calls:renderer.info.render.calls,geometries:renderer.info.memory.geometries}},null,2);}}
requestAnimationFrame(frame);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
